[workspace]
resolver = "3"
members = ["apps/remote-control", "apps/rc-relay", "crates/rc-ident", "crates/rc-stream", "crates/rc-proto", "crates/rc-android", "crates/rc-ios", "spikes/nettest", "spikes/netshape"]
exclude = ["vendor/iroh-relay", "vendor/iroh", "vendor/netdev"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.5.0"
publish = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Optimize third-party dependencies for binary size while keeping our own
# capture / encode / render / transport crates at opt-level = 3.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.remote-control]
opt-level = 3

[profile.release.package.rc-stream]
opt-level = 3

[profile.release.package.rc-proto]
opt-level = 3

[profile.release.package.rc-ident]
opt-level = 3

# Size-optimized profile for Android `librc_android.so` (leaves Windows release untouched).
# Keep default `panic = "unwind"` because transitive Android TLS crates use `catch_unwind`
# around `ndk_context::android_context()`.
[profile.android-dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# iOS static library `librc_ios.a` (apps/rc-ios). Xcode links and strips the app, so symbols
# stay in the archive (`strip` on a static library would remove what the linker needs).
[profile.ios-dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "none"

# Our relay needs hooks iroh-relay does not have (see vendor/iroh-relay/PATCHES.md).
# iroh's client side uses the same crate, so everything builds against the patched copy.
[patch.crates-io]
iroh-relay = { path = "vendor/iroh-relay" }
# A connection also gets paths through the other relays when its first one
# is a relay (see vendor/iroh/PATCHES.md).
iroh = { path = "vendor/iroh" }
# netwatch's netdev uses `libc::in6_ifreq`, which libc only has on macOS; this copy builds for
# iOS too (see vendor/netdev/PATCHES.md).
netdev = { path = "vendor/netdev" }
