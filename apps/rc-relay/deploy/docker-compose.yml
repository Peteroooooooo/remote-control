# rc-relay with Docker Compose (or as a Portainer stack).
#
# The image: built from the workspace root with
#   docker build -f apps/rc-relay/Dockerfile -t rc-relay .
# then loaded on the server (`docker save rc-relay | ssh server docker load`)
# or pushed to a registry; nothing is compiled on the server.
#
# First start: `docker logs rc-relay` shows the relay code to paste into
# the app (设置 → 自建中转). Owners: `docker exec rc-relay rc-relay owners list`.

services:
  rc-relay:
    image: rc-relay:latest
    container_name: rc-relay
    restart: unless-stopped
    # The relay looks up the server's public IPv4 and IPv6 addresses on its
    # interfaces; with the host's network it sees them, and both IP families work.
    network_mode: host
    volumes:
      - rc-relay:/var/lib/rc-relay
    # environment:
    #   # Instead of the addresses found at start (e.g. behind 1:1 NAT with
    #   # several public IPs): one per IP family, or a host name.
    #   RC_RELAY_PUBLIC: "203.0.113.7,2001:db8::7"
    # With a domain name and a certificate for it, mount a config file
    # (see src/config.rs) and start with `--config`:
    #   command: ["--config", "/etc/rc-relay/config.toml", "serve"]
    #   volumes:
    #     - ./config.toml:/etc/rc-relay/config.toml:ro
    #     - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  rc-relay:
