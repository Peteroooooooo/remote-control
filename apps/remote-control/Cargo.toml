[package]
name = "remote-control"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
# The lobby. wgpu (DX12 flip model) avoids WGL single-frame flashes on Windows; 0.36+ needs Rust 1.95.
eframe = { version = "0.35", default-features = false, features = ["wgpu_no_default_features", "accesskit", "default_fonts"] }
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
getrandom = "0.4"
# unstable-custom-transports: only for `path_selector` (see `net::Prefer`).
iroh = { version = "1.4.1", features = ["unstable-custom-transports"] }
# The same (patched) crate iroh uses; only for the TLS setup of the calls to the own relay.
iroh-relay = { version = "1.4.1", default-features = false }
# Interface list for LAN discovery; the version iroh's netwatch uses on Windows.
netdev = "0.45"
# Same version iroh uses; only for the BBR config iroh does not re-export.
noq-proto = { version = "1.4.0", default-features = false }
png = "0.17"
# The lobby window's HWND, to colour its frame; the version eframe uses.
raw-window-handle = "0.6"
rc-ident = { path = "../../crates/rc-ident" }
# Claiming the own relay and asking it for a code for another computer.
rc-relay = { path = "../rc-relay", default-features = false }
rc-stream = { path = "../../crates/rc-stream" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-service = "0.8"
winreg = "0.55"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# The exe's icon (build.rs); without toml it needs no TOML parser.
winresource = { version = "0.1.34", default-features = false }
