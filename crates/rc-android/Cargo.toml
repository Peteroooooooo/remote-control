[package]
name = "rc-android"
description = "Android JNI controller engine for remote-control"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
jni = "0.21"
rc-ident = { path = "../rc-ident" }
rc-proto = { path = "../rc-proto" }
rc-relay = { path = "../../apps/rc-relay", default-features = false }
rc-stream = { path = "../rc-stream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"
