[package]
name = "rc-ident"
description = "Text codes shared by remote-control and its relay: relay codes, device proofs"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
bs58 = "0.5"
# Keys and signatures only; the same types iroh uses for endpoint ids.
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
