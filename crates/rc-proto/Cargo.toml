[package]
name = "rc-proto"
description = "Cross-platform protocol, LAN discovery packets, and video reorder logic for remote-control"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
rc-stream = { path = "../rc-stream" }
tokio = { version = "1", features = ["net", "time", "io-util"] }
