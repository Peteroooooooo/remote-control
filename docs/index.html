<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Control · 交互演示</title>
<style>
  :root {
    --chrome: #1b1c20; --layer: #222428; --card: #2a2c31; --raised: #2d2f34; --border: #313338;
    --text: #e6e7ea; --dim: #8f939b; --faint: #6b6f77;
    --accent: #3b7fe0; --accent-hover: #4b8be6; --accent-pressed: #3471c9; --link: #8db6f0;
    --green: #3fb950; --amber: #d29922; --amber-text: #e3b34a; --red: #e5534b; --danger: #ff8a83;
    --gone: #5a5e66;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.22, 1.2, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0f1013; color: var(--text);
    font: 14px/1.45 "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 18px 16px 40px; gap: 14px; }
  b { font-weight: 700; }
  .mono { font-family: Consolas, "Cascadia Mono", "SFMono-Regular", Menlo, monospace; }

  svg.ic { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle;
    fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  button svg.ic { width: 14px; height: 14px; }

  /* Demo guide bar (outside the app window) */
  .guide-wrap { width: 920px; max-width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .guide-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: .2px; }
  .badge-pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(59,127,224,.15); color: var(--link); }
  .lang-btn { height: 28px; padding: 0 4px; border-radius: 99px; font-size: 11.5px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); color: var(--dim);
    display: inline-flex; align-items: center; gap: 2px; cursor: pointer; }
  .lang-btn:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); }
  .lang-btn span { padding: 2px 7px; border-radius: 99px; line-height: 1.2;
    transition: background .15s var(--ease), color .15s var(--ease); }
  .lang-btn span.on { background: rgba(59,127,224,.24); color: #d6e6ff; font-weight: 700; }
  .guide-head .grow { flex: 1; }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .step-btn { height: 30px; padding: 0 11px; border-radius: 99px; font-size: 12px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); color: var(--dim);
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: all .16s var(--ease); }
  .step-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .step-btn.active { background: rgba(59,127,224,.18); border-color: rgba(59,127,224,.45); color: #d6e6ff; }
  .step-btn.done { border-color: rgba(63,185,80,.4); color: #8fe39c; }
  .guide-tip { font-size: 12.5px; color: var(--dim); background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 8px 12px;
    display: flex; align-items: center; gap: 10px; }
  .guide-tip b { color: var(--text); }
  .guide-tip .grow { flex: 1; }

  @keyframes pulse-once {
    0% { box-shadow: 0 0 0 0 rgba(59,127,224,.65); }
    60% { box-shadow: 0 0 0 7px rgba(59,127,224,0); }
    100% { box-shadow: 0 0 0 0 rgba(59,127,224,0); }
  }
  .pulse { animation: pulse-once 1.1s var(--ease) 2; }

  /* Buttons & Inputs with tactile press feedback */
  button { font: inherit; color: var(--text); background: rgba(255,255,255,.063); border: 1px solid rgba(255,255,255,.05);
    border-radius: 6px; height: 32px; padding: 0 12px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .14s var(--ease), color .14s var(--ease), border-color .14s var(--ease), transform .12s var(--ease), box-shadow .14s var(--ease); }
  button:hover { background: rgba(255,255,255,.105); }
  button:active:not(:disabled) { transform: scale(.97); background: rgba(255,255,255,.05); }
  button:disabled { opacity: .4; cursor: default; background: rgba(255,255,255,.063); }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  button.primary:hover { background: var(--accent-hover); box-shadow: 0 2px 10px rgba(59,127,224,.28); }
  button.primary:active:not(:disabled) { background: var(--accent-pressed); box-shadow: none; }
  button.primary:disabled { background: var(--accent); box-shadow: none; }
  button.soft { background: rgba(59,127,224,.16); border-color: transparent; color: var(--link); }
  button.soft:hover { background: rgba(59,127,224,.26); color: #b8d3f9; }
  button.soft:disabled { background: rgba(255,255,255,.04); color: var(--dim); }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost:hover { background: rgba(255,255,255,.068); color: var(--text); }
  button.link { background: none; border-color: transparent; color: var(--link); padding: 0 8px; }
  button.link:hover { background: rgba(59,127,224,.14); }
  button.icon { width: 32px; padding: 0; justify-content: center; background: none; border-color: transparent; color: var(--dim); }
  button.icon:hover { background: rgba(255,255,255,.068); color: var(--text); }
  button.icon.red:hover { background: rgba(229,83,75,.16); color: var(--danger); }
  button.danger { background: rgba(229,83,75,.16); border-color: transparent; color: var(--danger); }
  button.danger:hover { background: rgba(229,83,75,.26); }
  button.danger-solid { background: #c93b36; border-color: transparent; color: #fff; }
  button.danger-solid:hover { background: #dc4a45; }

  input.field { font: inherit; color: var(--text); background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.063);
    border-radius: 6px; height: 32px; padding: 0 10px; outline: none;
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease); }
  input.field:focus { border-color: var(--accent); background: rgba(255,255,255,.055); box-shadow: 0 0 0 3px rgba(59,127,224,.16); }
  input.field::placeholder { color: var(--faint); }

  /* Fluent ToggleSwitch with tactile stretch */
  .sw { width: 40px; height: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,.42); position: relative; cursor: pointer;
    flex: none; transition: background .2s var(--ease), border-color .2s var(--ease); }
  .sw::after { content: ""; position: absolute; top: 3px; left: 4px; width: 12px; height: 12px; border-radius: 6px; background: #c9cbd0;
    transition: left .22s var(--spring), width .16s var(--ease), background .18s var(--ease), transform .16s var(--ease); }
  .sw:hover { border-color: rgba(255,255,255,.72); }
  .sw:hover::after { transform: scale(1.08); }
  .sw:active::after { width: 15px; }
  .sw.on { background: var(--accent); border-color: var(--accent); }
  .sw.on::after { left: 23px; background: #fff; }
  .sw.on:active::after { left: 20px; width: 15px; }
  .sw.off-dis { opacity: .35; pointer-events: none; }

  /* Main App Window */
  .win { width: 920px; max-width: 100%; height: 610px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden;
    position: relative; background: var(--chrome); display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(0,0,0,.6); }
  .titlebar { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding-left: 12px; font-size: 12px; color: var(--dim); user-select: none; }
  .app-icon { width: 16px; height: 16px; flex: none; display: block; }
  .caps { margin-left: auto; display: flex; }
  .caps span { width: 46px; height: 32px; display: grid; place-items: center; color: var(--dim); transition: background .12s, color .12s; }
  .caps span:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .caps span svg.ic { width: 12px; height: 12px; }
  .caps span.x { cursor: pointer; }
  .caps span.x:hover { background: #c42b1c; color: #fff; }
  .body { flex: 1; display: flex; min-height: 0; }

  /* Side pane */
  .pane { width: 236px; flex: none; padding: 8px 12px 14px; display: flex; flex-direction: column; }
  .me { display: flex; align-items: center; gap: 12px; padding: 8px; margin-bottom: 12px; border-radius: 8px;
    cursor: pointer; transition: background .15s var(--ease), transform .12s var(--ease); }
  .me:hover { background: rgba(255,255,255,.048); }
  .me:active { transform: scale(.985); background: rgba(255,255,255,.03); }
  .me .nm { font-size: 16px; font-weight: 700; }
  .me .st { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }

  .nav { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border-radius: 6px; cursor: pointer;
    color: var(--text); position: relative; margin-bottom: 2px;
    transition: background .15s var(--ease), color .15s var(--ease); }
  .nav:hover { background: rgba(255,255,255,.045); }
  .nav:active { background: rgba(255,255,255,.03); }
  .nav.on { background: rgba(255,255,255,.068); }
  .nav.on::before { content: ""; position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent); }
  .nav.on.anim::before { animation: nav-pill .24s var(--spring); }
  @keyframes nav-pill { from { transform: scaleY(.25); opacity: .4; } to { transform: scaleY(1); opacity: 1; } }
  .nav svg.ic { color: var(--dim); transition: color .15s var(--ease), transform .18s var(--ease); }
  .nav:hover svg.ic { color: var(--text); }
  .nav.on svg.ic { color: var(--text); }
  .nav .count { margin-left: auto; font-size: 12px; color: var(--dim); transition: color .15s; }

  /* Clickable relay summary at bottom-left */
  .relays { margin-top: auto; padding: 8px; border-radius: 8px; font-size: 12px; color: var(--dim);
    cursor: pointer; transition: background .15s var(--ease), transform .12s var(--ease); }
  .relays:hover { background: rgba(255,255,255,.048); }
  .relays:active { transform: scale(.985); background: rgba(255,255,255,.03); }
  .relays .h { margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
  .relays .h .go { opacity: 0; transform: translateX(-3px); transition: opacity .15s var(--ease), transform .15s var(--ease); color: var(--link); font-size: 11px; }
  .relays:hover .h .go { opacity: 1; transform: translateX(0); }
  .relays div.r { display: flex; align-items: center; gap: 8px; height: 22px; color: var(--text); }
  .relays div.r span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .relays div.r span:last-child { margin-left: auto; color: var(--dim); flex: none; }

  .pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; position: relative; }
  .pdot.live { box-shadow: 0 0 0 0 rgba(63,185,80,.45); animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63,185,80,.35); }
    50% { box-shadow: 0 0 0 4px rgba(63,185,80,0); }
  }
  .pdot.amber { background: var(--amber); animation: none; }
  .pdot.grey { background: var(--gone); animation: none; }

  .content { flex: 1; position: relative; background: var(--layer); border-top-left-radius: 8px;
    border: 1px solid rgba(255,255,255,.047); border-right: 0; border-bottom: 0; min-width: 0; overflow: hidden; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 22px 28px 24px;
    scrollbar-width: none; -ms-overflow-style: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .scroll.page-enter { animation: page-in .2s var(--ease); }
  @keyframes page-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

  /* Win11-style hover-expanding overlay scrollbar with idle fade */
  .sbar-track {
    position: absolute; top: 6px; right: 2px; bottom: 6px; width: 14px; z-index: 15;
    border-radius: 7px; transition: background .16s var(--ease), opacity .25s var(--ease); opacity: 0; pointer-events: none;
  }
  .sbar-track.visible { opacity: 1; pointer-events: auto; }
  .sbar-track.visible.idle { opacity: 0; }
  .sbar-track.visible:hover, .sbar-track.visible.drag { opacity: 1; background: rgba(255,255,255,.035); }
  .sbar-thumb {
    position: absolute; right: 3px; width: 3px; min-height: 28px; border-radius: 99px;
    background: rgba(255,255,255,.22); cursor: grab;
    transition: width .16s var(--ease), background .16s var(--ease);
  }
  .sbar-track:hover .sbar-thumb, .sbar-track.drag .sbar-thumb {
    width: 8px; background: rgba(255,255,255,.38);
  }
  .sbar-track.drag .sbar-thumb { background: rgba(255,255,255,.52); cursor: grabbing; }

  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .head h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .head .grow { flex: 1; }
  .copied { color: var(--green) !important; border-color: rgba(63,185,80,.28) !important; background: rgba(63,185,80,.1) !important; }
  .copied svg.ic { animation: check-pop .26s var(--spring); }
  @keyframes check-pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Subtle hover tooltip */
  .tip-wrap { position: relative; display: inline-flex; }
  .tip-wrap .tip-box {
    position: absolute; right: 0; top: calc(100% + 7px); z-index: 25;
    padding: 6px 10px; border-radius: 6px; font-size: 12px; line-height: 1.4; white-space: nowrap;
    background: var(--raised); color: var(--text); border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 8px 24px rgba(0,0,0,.5); pointer-events: none;
    opacity: 0; transform: translateY(-4px) scale(.98);
    transition: opacity .15s var(--ease), transform .15s var(--ease);
  }
  .tip-wrap:hover .tip-box { opacity: 1; transform: translateY(0) scale(1); }

  /* Modern connect input: clear placeholder on focus + smooth focus ring + Paste/Add swap */
  .connect { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 5px 0 14px; border-radius: 8px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.068);
    transition: border-color .16s var(--ease), background .16s var(--ease), box-shadow .18s var(--ease); }
  .connect:hover { border-color: rgba(255,255,255,.12); background: rgba(255,255,255,.05); }
  .connect:focus-within { border-color: var(--accent); background: rgba(255,255,255,.055); box-shadow: 0 0 0 3px rgba(59,127,224,.16); }
  .connect > svg.ic { color: var(--dim); transition: color .16s var(--ease), transform .18s var(--ease); }
  .connect:focus-within > svg.ic { color: var(--link); transform: scale(1.06); }
  .connect input { flex: 1; font: inherit; color: var(--text); background: none; border: 0; outline: none; min-width: 0; height: 100%; }
  .connect input::placeholder { color: var(--faint); transition: opacity .14s var(--ease); }
  .connect input:focus::placeholder { opacity: 0; }
  .connect .act-paste {
    height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); color: var(--dim);
    animation: btn-swap .16s var(--ease);
  }
  .connect .act-paste:hover { background: rgba(255,255,255,.11); color: var(--text); }
  .connect .act-go { height: 28px; padding: 0 12px; font-size: 12px; border-radius: 6px; animation: btn-swap .16s var(--ease); }
  @keyframes btn-swap { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

  .codes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--dim);
    animation: slide-down .2s var(--ease); }
  .codes .chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 2px 0 10px; border-radius: 13px;
    background: rgba(255,255,255,.055); color: var(--text); animation: pop .18s var(--spring); }
  .codes .chip button { height: 22px; border-radius: 11px; padding: 0 8px; font-size: 12px; }
  @keyframes slide-down { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  .gap18 { height: 18px; }

  /* Banners */
  .banner { display: flex; align-items: center; gap: 12px; padding: 9px 9px 9px 14px; border-radius: 8px; margin-bottom: 18px; min-height: 50px;
    animation: slide-down .22s var(--ease); }
  .banner.red { background: rgba(229,83,75,.12); border: 1px solid rgba(229,83,75,.25); }
  .banner.blue { background: rgba(59,127,224,.1); border: 1px solid rgba(59,127,224,.22); }
  .banner.amber { background: rgba(210,153,34,.12); border: 1px solid rgba(210,153,34,.25); }
  .banner .grow { flex: 1; }
  .banner > svg.ic { width: 18px; height: 18px; }
  .banner.red > svg.ic { color: var(--danger); }
  .banner.blue > svg.ic { color: var(--link); }
  .banner.amber > svg.ic { color: var(--amber-text); }

  /* Sections & Rows */
  .sec { margin-bottom: 20px; scroll-margin-top: 14px; }
  .sec.hi .group { animation: flash-border 1.25s var(--ease); }
  @keyframes flash-border {
    0% { box-shadow: 0 0 0 1.5px var(--accent); background: rgba(59,127,224,.1); }
    100% { box-shadow: 0 0 0 0 transparent; background: var(--card); }
  }
  .sh { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; font-size: 13px; }
  .sh b { font-size: 13px; }
  .sh span { color: var(--dim); font-size: 12px; }
  .sh .sh-act { margin-left: auto; width: 22px; height: 22px; padding: 0; border-radius: 5px; }
  .sh .sh-act svg.ic { width: 13px; height: 13px; }
  .sh .sh-act.spinning svg.ic { animation: spin .75s linear infinite; }
  .group { background: var(--card); border-radius: 10px; border: 1px solid rgba(255,255,255,.035); overflow: hidden; }
  .group > * { position: relative; }
  .group > * + *::before { content: ""; position: absolute; top: 0; right: 0; height: 1px; background: rgba(255,255,255,.05); left: 0; }
  .group > .row + *::before { left: 62px; }
  .row { display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 10px 0 14px;
    transition: background .15s var(--ease); cursor: default; user-select: none; }
  .row:hover { background: rgba(255,255,255,.032); }
  .row:hover .av { transform: scale(1.03); }
  .row.flash { animation: flash-row 1.2s var(--ease); }
  @keyframes flash-row {
    0% { background: rgba(59,127,224,.24); transform: translateY(-2px); }
    30% { transform: translateY(0); }
    100% { background: transparent; }
  }
  .row.asking { background: rgba(210,153,34,.07); }
  .row.asking::after { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--amber); }

  .why { padding: 2px 14px 14px 62px; font-size: 13px; color: var(--dim); animation: slide-down .2s var(--ease); }
  .why .btns { display: flex; gap: 8px; margin-top: 8px; }

  .av { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; position: relative; flex: none;
    background: rgba(255,255,255,.06); color: var(--dim); transition: transform .16s var(--ease); }
  .av svg.ic { width: 17px; height: 17px; }
  .av.mine { background: rgba(59,127,224,.15); color: var(--link); }
  .av.trusted { background: rgba(139,124,246,.16); color: #b6a8ff; }
  .dot { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--gone);
    border: 2px solid var(--card); transition: background .2s var(--ease); }
  .dot.on { background: var(--green); }
  .dot.ctl { background: var(--accent); animation: breathe-blue 1.8s ease-in-out infinite; }
  @keyframes breathe-blue {
    0%, 100% { box-shadow: 0 0 0 0 rgba(59,127,224,.55); }
    50% { box-shadow: 0 0 0 4px rgba(59,127,224,0); }
  }
  .dot.amber { background: var(--amber); }

  .txt { flex: 1; min-width: 0; }
  .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm input.field { height: 26px; width: 190px; padding: 0 8px; font-weight: 700; }
  .sub { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub.amber { color: var(--amber-text); } .sub.blue { color: var(--link); }
  .acts { display: flex; align-items: center; gap: 6px; }

  .spin { width: 13px; height: 13px; border: 2px solid rgba(141,182,240,.25); border-top-color: var(--link); border-radius: 50%;
    animation: spin .75s linear infinite; display: inline-block; flex: none; }
  .spin.big { width: 16px; height: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity: 0; } }

  /* Settings items */
  .item { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 10px 14px; transition: background .14s var(--ease); }
  .item:hover { background: rgba(255,255,255,.018); }
  .item > svg.ic { width: 17px; height: 17px; color: var(--dim); }
  .item .txt2 { flex: 1; min-width: 0; }
  .item .t { font-size: 14px; }
  .item .d { font-size: 12px; color: var(--dim); }
  .item .r { display: flex; align-items: center; gap: 8px; }
  .item.dis { opacity: .45; }
  .item.dis:hover { background: none; }
  .item.add { cursor: pointer; min-height: 46px; color: var(--link); }
  .item.add svg.ic { color: var(--link); transition: transform .16s var(--ease); }
  .item.add:hover { background: rgba(255,255,255,.035); }
  .item.add:hover svg.ic { transform: rotate(90deg); }
  .item.add-form { animation: slide-down .18s var(--ease); }

function normalizeLang(raw) {
  if (!raw) return null;
  const s = String(raw).trim().toLowerCase();
  if (s.startsWith('zh')) return 'zh';
  if (s.startsWith('en')) return 'en';
  return null;
}

  const param = normalizeLang(new URLSearchParams(location.search).get('lang'));
  if (param) return param;
  try {

    if (saved) return saved;
  } catch {}
  return normalizeLang(navigator.language) || 'en';

function t(key, ...args) {
  const dict = I18N[lang] || I18N.en;
  const val = dict[key];
  return typeof val === 'function' ? val(...args) : val;
}

function getKindInfo(k) {
  return { title: t(`kind_${k}_title`), note: t(`kind_${k}_note`) };
}

function getSteps() {
  return [
    { id: 'input', title: t('step_input_title'), tip: t('step_input_tip'), page: 'devices', target: 'connect-box' },
    { id: 'copy', title: t('step_copy_title'), tip: t('step_copy_tip'), page: 'devices', target: 'copy-btn' },
    { id: 'settings', title: t('step_settings_title'), tip: t('step_settings_tip'), page: 'settings', target: 'nav-settings' },
    { id: 'relay', title: t('step_relay_title'), tip: t('step_relay_tip'), page: 'devices', target: 'relay-box' },
  ];
}

function selfName() {
  return S.selfNameCustom ? S.name : t('selfDefaultName');
}

function devName(d) {
  if (!d) return '';
  return d.customName ? d.name : t(`devName_${d.nameKey}`);
}

function devNameById(id, fallbackKey) {
  const d = dev(id);
  if (d) return devName(d);
  return fallbackKey ? t(`devName_${fallbackKey}`) : '';
}

function devVia(d) {
  return d.viaKey ? t(`via_${d.viaKey}`) : '';
}

function devInfo(d) {
  if (d.retrying) return t('connecting');
  if (d.unreach) return t('unreach');
  return t('onlineInfo', d.ms, d.conn === 'relay' ? t('pathRelay') : t('pathDirect'));
}

function applyLangChrome() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('docTitle');
  const badge = document.getElementById('badge-demo');
  if (badge) badge.textContent = t('badgeDemo');
  const btnIn = document.getElementById('btn-incoming');
  if (btnIn) btnIn.textContent = t('btnIncoming');
  const btnRst = document.getElementById('btn-reset');
  if (btnRst) btnRst.textContent = t('btnReset');
  const langBtn = document.getElementById('btn-lang');
  if (langBtn) {
    langBtn.querySelectorAll('span[data-l]').forEach(sp => {
      sp.classList.toggle('on', sp.dataset.l === lang);
    });
  }
  const closeCap = document.querySelector('#win .titlebar .caps span.x');
  if (closeCap) closeCap.title = t('closeToTray');
}

function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch {}
  try {
    const url = new URL(location.href);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url.toString());
  } catch {}
  render();
  renderOverlay();
}

function mountShell() {
  if (shellMounted) return;
  shellMounted = true;
  const w = document.getElementById('win');
  w.innerHTML = `
    <div class="titlebar">
      ${appIconSvg()}Remote Control
      <div class="caps"><span>${ic('min')}</span><span>${ic('max')}</span><span class="x" onclick="S.closed=true;menu=null;render()" title="${esc(t('closeToTray'))}">${ic('close')}</span></div>
    </div>
    <div class="body">
      <div class="pane"></div>
      <div class="content">
        <div class="scroll"></div>
        <div class="sbar-track"><div class="sbar-thumb"></div></div>
      </div>
    </div>
    <div class="menu-layer"></div>
    <div class="modal-layer"></div>
    <div class="closed-layer"></div>
    <div class="toasts"></div>`;
  bindScrollbarOnce();
}

  mountShell();

  S = {
    name: '',
    selfNameCustom: false,
    icon: 'desktop',
    relays: [
      { host: 'relay-a.example.com:7843', state: 'home', rtt: 42 },

function toast(text, tone = 'info', action) {
  const box = document.querySelector('#win .toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = `toast ${tone}`;
  el.innerHTML = ic({ ok: 'ok', warn: 'warn', err: 'err' }[tone] || 'info') + `<span>${esc(text)}</span>`;
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    el.classList.add('out');
    setTimeout(() => el.remove(), 190);
  };
  if (action) {
    const b = document.createElement('button');
    b.className = 'link'; b.textContent = action[0];
    b.onclick = () => { finish(); action[1](); };
    el.appendChild(b);
  }
  const x = document.createElement('button');
  x.className = 'icon'; x.style.height = '28px'; x.style.width = '28px';
  x.innerHTML = ic('close');
  x.onclick = () => { finish(); action?.[2]?.(); };
  el.appendChild(x);
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { if (!done) { finish(); action?.[2]?.(); } }, action ? 6500 : 4800);
}

/* ---------- Custom Hover-Expanding Scrollbar (bound once on persistent shell) ---------- */
function bindScrollbarOnce() {
  const sc = document.querySelector('#win .scroll');
  const track = document.querySelector('#win .sbar-track');
  const thumb = document.querySelector('#win .sbar-thumb');
  if (!sc || !track || !thumb) return;

  const kickIdle = () => {
    track.classList.remove('idle');
    clearTimeout(sbarIdleTimer);
    sbarIdleTimer = setTimeout(() => {
      if (!track.classList.contains('drag')) track.classList.add('idle');
    }, 1500);
  };

  updateScrollbar = (keepVisible = false) => {
    const sh = sc.scrollHeight, ch = sc.clientHeight;
    if (sh <= ch + 1) {
      track.classList.remove('visible', 'idle');
      return;
    }
    track.classList.add('visible');
    const th = track.clientHeight;
    const h = Math.max(28, (ch / sh) * th);
    const maxTop = th - h;
    const y = (sc.scrollTop / (sh - ch)) * maxTop;
    thumb.style.height = h + 'px';
    thumb.style.top = y + 'px';
    if (keepVisible) kickIdle();
  };

  sc.addEventListener('scroll', () => updateScrollbar(true), { passive: true });
  sc.addEventListener('wheel', () => {
    kickIdle();
    if (menu) { menu = null; renderMenu(); }
  }, { passive: true });

  let dragging = false, startY = 0, startScroll = 0;
  thumb.addEventListener('mousedown', e => {
    e.preventDefault();
    dragging = true;
    startY = e.clientY;
    startScroll = sc.scrollTop;
    track.classList.add('drag');
    track.classList.remove('idle');
    if (menu) { menu = null; renderMenu(); }
  });
  track.addEventListener('mousedown', e => {
    if (e.target === thumb) return;
    const rect = track.getBoundingClientRect();
    const ratio = (e.clientY - rect.top) / rect.height;
    sc.scrollTo({ top: ratio * (sc.scrollHeight - sc.clientHeight), behavior: 'smooth' });
    kickIdle();
    if (menu) { menu = null; renderMenu(); }
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const sh = sc.scrollHeight, ch = sc.clientHeight, th = track.clientHeight;
    const h = Math.max(28, (ch / sh) * th);
    const ratio = (sh - ch) / Math.max(1, th - h);
    sc.scrollTop = startScroll + (e.clientY - startY) * ratio;
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('drag');
    kickIdle();
  });
}

function control(id) {
  const d = dev(id);
  if (!d || !d.online) return;
  if (d.kind === 'mine') {
    openRemote(d, 'autoAccept');
    return;
  }
  clearInterval(waitTimer);
  d.waiting = true;
  d.waitLeft = 30;
  waitTimer = setInterval(() => {
    const x = dev(id);
    if (!x || !x.waiting) { clearInterval(waitTimer); return; }
    x.waitLeft = Math.max(0, (x.waitLeft || 1) - 1);
    if (x.waitLeft <= 0) {
      clearInterval(waitTimer);
      x.waiting = false;
      if (modal?.kind === 'wait') modal = null;
      render();
      toast(t('toastWaitTimeout', devName(x)), 'warn');
      return;
    }
    const lbl = document.querySelector(`.row[data-id="${id}"] .wait-sec`);
    if (lbl) lbl.textContent = x.waitLeft;
    const foot = document.getElementById('modal-countdown');
    if (foot && modal?.kind === 'wait') foot.textContent = t('countdown', x.waitLeft);
  }, 1000);
  modal = {
    kind: 'wait',
    devId: id,
    icon: 'shield',
    tone: 'amber',
    bar: true,
    onCancel: () => cancelWait(id),
    actions: [
      () => {
        clearInterval(waitTimer);
        const x = dev(id); if (x) x.waiting = false;
        render();
        toast(t('toastDeclined', devName(x || d)), 'warn');
      },
      () => {

    entries: [
      { type: 'connect', devId: d.id, fallbackKey: d.nameKey },

    ],

function runTermCmd(cmd) {
  if (!term) return;
  const c = cmd.trim();
  if (!c) return;
  term.entries.push({ type: 'raw', text: `PS ${term.cwd}> ${c}` });
  const low = c.toLowerCase();
  const targetName = devNameById(term.id, term.fallbackKey);
  if (low === 'cls' || low === 'clear') {
    term.entries = [];
  } else if (low.includes('git status')) {
    term.entries.push(
      { type: 'raw', text: 'On branch main' },
      { type: 'raw', text: "Your branch is up to date with 'origin/main'." },
      { type: 'raw', text: 'nothing to commit, working tree clean' }
    );
  } else if (low === 'dir' || low === 'ls') {
    term.entries.push(
      { type: 'raw', text: 'Mode                 LastWriteTime         Length Name' },
      { type: 'raw', text: '----                 -------------         ------ ----' },
      { type: 'raw', text: 'd-----        2026/11/18     21:10                Desktop' },
      { type: 'raw', text: 'd-----        2026/11/18     19:40                Projects' },
      { type: 'raw', text: '-a----        2026/11/18     23:30       14281728 remote-control.exe' }
    );
  } else if (low.includes('hostname')) {
    term.entries.push({ type: 'raw', text: targetName });
  } else if (low.includes('ipconfig')) {
    term.entries.push(
      { type: 'raw', text: 'Ethernet adapter:' },
      { type: 'raw', text: '   IPv4 Address . . . . . : 192.168.1.42' },
      { type: 'raw', text: '   IPv6 Address . . . . . : 2001:db8::42' }
    );
  } else {
    term.entries.push({ type: 'demoExec', devId: term.id, fallbackKey: term.fallbackKey, cmd: c });
  }
  term.entries.push({ type: 'raw', text: '' });
  renderOverlay();
  setTimeout(() => {
    const body = document.querySelector('.term-body');
    if (body) body.scrollTop = body.scrollHeight;
    document.getElementById('term-cmd')?.focus();
  }, 20);
}

/* ---------- Codes & Modern Connect Input ---------- */
function fmtTime(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function copyCode() {
  copied = Date.now();
  const now = new Date();
  S.codes.push({ n: ++codeSeq, time: fmtTime(now) });
  markStep('copy');
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText('rc1-self-7K9mPq2x8nVw').catch(() => {});
  }
  render();
  setTimeout(render, 2100);
}

function revoke(n) {
  const idx = S.codes.findIndex(x => x.n === n);
  if (idx === -1) return;
  S.codes.splice(idx, 1);
  render();
  toast(t('toastRevoked'), 'info');
}

function syncConnectAction() {
  const input = document.getElementById('connect-code-in');
  const slot = document.getElementById('connect-action-slot');
  if (!input || !slot) return;
  const hasVal = input.value.trim().length > 0;
  const curMode = slot.dataset.mode;
  const nextMode = hasVal ? 'add' : 'empty';
  const curLang = slot.dataset.lang;
  if (curMode === nextMode && curLang === lang) return;
  slot.dataset.mode = nextMode;
  slot.dataset.lang = lang;
  slot.innerHTML = hasVal
    ? `<button class="soft act-go" type="button" onclick="pasteCode(document.getElementById('connect-code-in').value)">${t('add')}</button>`
    : '';
}

function onConnectInput(el) {
  syncConnectAction();
  if (/^rc1-[A-Za-z0-9_-]{8,}$/.test(el.value.trim())) {
    const val = el.value;
    clearTimeout(pasteTimer);
    pasteTimer = setTimeout(() => pasteCode(val), 140);
  }
}

function pasteCode(text) {
  clearTimeout(pasteTimer);
  const v = (text || '').trim();
  if (!v) return;
  const clearInput = () => {
    const input = document.getElementById('connect-code-in');
    if (input) { input.value = ''; syncConnectAction(); }
  };
  if (/^rc-relay-/i.test(v)) {
    clearInput();
    toast(t('toastRelayCodeWrongBox'), 'warn');
    return;
  }
  if (/^rc1-self-/i.test(v)) {
    clearInput();
    toast(t('toastSelfCode'), 'warn');
    return;
  }
  if (!/^rc1-[A-Za-z0-9_-]{8,}$/.test(v)) {
    clearInput();
    toast(/^rc1/i.test(v) ? t('toastCodeBad') : t('toastNotCode'), 'warn');
    return;
  }
  markStep('input');
  if (savedDevsForEmpty !== null) savedDevsForEmpty = null;
  clearInput();
  const existing = dev('guest-new');
  if (existing) {
    revealRow('guest-new');
    toast(t('toastAlreadyTemp', devName(existing)), 'info');
    return;
  }
  const nd = {
    id: 'guest-new', nameKey: 'guestNew', customName: false, name: '', icon: 'laptop', kind: 'temp',
    viaKey: 'code', online: true, ms: 26, conn: 'direct',
  };
  S.devs.push(nd);
  render();
  revealRow('guest-new');
  toast(t('toastAddedTemp', devName(nd)), 'ok');
}

function retry(id) {
  const d = dev(id);
  if (!d) return;
  d.unreach = false; d.retrying = true; why = null;
  render();
  setTimeout(() => {
    const x = dev(id);
    if (x) { x.retrying = false; x.unreach = true; render(); }
  }, 1300);

/* ---------- Menu (auto-flip using actual rendered height) ---------- */
function openMenu(ev, id) {
  ev.stopPropagation();
  if (menu && menu.id === id) { menu = null; renderMenu(); return; }
  const r = ev.currentTarget.getBoundingClientRect();
  const w = document.getElementById('win').getBoundingClientRect();
  menu = {
    id,
    rightRef: r.right - w.left,
    topRef: r.top - w.top,
    botRef: r.bottom - w.top,
    winH: w.height,
  };
  renderMenu();
}
function renderMenu() {
  const layer = document.querySelector('#win .menu-layer');
  if (!layer) return;
  if (!menu) { layer.innerHTML = ''; return; }
  const d = dev(menu.id);
  if (!d) { menu = null; layer.innerHTML = ''; return; }
  const it = (icon, label, fn, cls = '', extra = '') =>
    `<div class="it ${cls}" onclick="event.stopPropagation();menu=null;renderMenu();${fn}">${icon ? ic(icon) : '<span style="width:15px"></span>'}<span>${label}</span>${extra}</div>`;
  let h = it('term', t('menuTerminal'), d.online ? `openTerm('${d.id}')` : '', d.online ? '' : 'dis');
  if (d.kind !== 'temp') {
    h += it('rename', t('menuRename'), `startRename('${d.id}')`);
    h += `<div class="sep"></div><div class="mhead">${t('menuWhenCtrl')}</div>`;
    for (const k of ['mine', 'trusted']) {
      h += it('', `${getKindInfo(k).title} <span class="msub">${k === 'mine' ? t('menuAutoAccept') : t('menuPrompt')}</span>`, `setKind('${d.id}','${k}')`, '',
        d.kind === k ? `<span class="tick">${ic('check')}</span>` : '');
    }
  }
  h += `<div class="sep"></div>` + it('del', t('menuRemove'), `askDelete('${d.id}')`, 'danger');
  layer.innerHTML = `<div class="menu" style="left:${Math.max(12, menu.rightRef - 210)}px;top:${menu.botRef + 4}px" onclick="event.stopPropagation()">${h}</div>`;
  const mEl = layer.firstElementChild;
  if (mEl) {
    const mw = mEl.offsetWidth;
    mEl.style.left = Math.max(12, menu.rightRef - mw) + 'px';
    const mh = mEl.offsetHeight;
    if (menu.botRef + 4 + mh > menu.winH - 8) {
      mEl.classList.add('up');
      mEl.style.top = Math.max(40, menu.topRef - mh - 4) + 'px';
    }
  }
}
document.addEventListener('click', () => { if (menu) { menu = null; renderMenu(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (term) { term = null; renderOverlay(); return; }
  if (menu) { menu = null; renderMenu(); return; }
  if (modal) {
    const cb = modal.onCancel;
    modal = null;
    render();
    if (cb) cb();
  }
});

/* ---------- Render Devices & Settings ---------- */
function rowHtml(d) {
  const via = devVia(d);
  let sub = `${esc(devInfo(d))}${d.kind === 'temp' && via ? ' · ' + esc(via) : ''}`;
  let subCls = d.unreach ? 'amber' : '', acts = '';
  const ctl = S.controlling === d.id;

  if (d.req === 'out') {
    sub = `<span class="spin"></span>${t('waitingPeer')}`;
    acts += `<button class="ghost" onclick="event.stopPropagation();cancelRemember('${d.id}')">${t('cancel')}</button>`;
  } else if (d.kind === 'temp') {
    acts += `<button class="ghost" onclick="event.stopPropagation();remember('${d.id}')">${ic('add')}${t('remember')}</button>`;
  }

  if (ctl) { sub = t('controlling'); subCls = 'blue'; }
  if (d.waiting) sub = `<span class="spin"></span>${t('waitingApprovalPrefix')}<span class="wait-sec">${d.waitLeft ?? 30}</span>${t('waitingApprovalSuffix')}`;
  if (d.retrying) sub = `<span class="spin"></span>${t('connecting')}`;

  if (ctl) {
    acts += `<button class="danger" onclick="event.stopPropagation();disconnect()">${t('disconnect')}</button>`;
  } else if (d.waiting) {
    acts += `<button class="ghost" onclick="event.stopPropagation();cancelWait('${d.id}')">${t('cancel')}</button>`;
  } else if (d.unreach) {
    acts += `<button class="ghost" onclick="event.stopPropagation();why=why==='${d.id}'?null:'${d.id}';render()">${t('details')}</button>`;
  } else {
    acts += `<button class="soft" ${d.online ? '' : 'disabled'} onclick="event.stopPropagation();control('${d.id}')">${t('control')}</button>`;
  }

  const dName = devName(d);
  const name = renaming === d.id
    ? `<input class="field" value="${esc(dName)}" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){renaming=null;render()}" onblur="endRename('${d.id}',this.value,true)">`
    : `<span>${esc(dName)}</span>`;

  const dot = ctl ? 'ctl' : d.online ? 'on' : d.unreach ? 'amber' : '';
  let h = `<div class="row" data-id="${d.id}" ondblclick="if('${d.online}'==='true' && !renaming) control('${d.id}')">
    <div class="av ${d.kind}">${ic(d.icon)}<span class="dot ${dot}"></span></div>
    <div class="txt"><div class="nm">${name}</div><div class="sub ${subCls}">${sub}</div></div>
    <div class="acts" ondblclick="event.stopPropagation()">${acts}<button class="icon" title="${esc(t('more'))}" onclick="openMenu(event,'${d.id}')">${ic('more')}</button></div>
  </div>`;

  if (why === d.id && d.unreach) {
    h += `<div class="why">${t('unreachWhy')}
      <div class="btns"><button onclick="retry('${d.id}')">${t('retry')}</button><button onclick="jumpToSettings('sec-relays');why=null;">${t('goSettings')}</button></div></div>`;
  }
  return h;
}

function devicesHtml() {
  let list = '';
  for (const k of ['mine', 'trusted', 'temp']) {
    const ds = S.devs.filter(d => d.kind === k);
    if (!ds.length) continue;
    const ki = getKindInfo(k);
    list += `<div class="sec"><div class="sh"><b>${ki.title}</b><span>${ki.note}</span></div>
      <div class="group">${ds.map(rowHtml).join('')}</div></div>`;
  }
  if (!list) {
    list = `<div class="empty">${ic('devices')}<div class="et">${t('emptyTitle')}</div><div class="ed">${t('emptyDesc')}</div></div>`;
  }
  let banner = '';
  if (S.hostedById) {
    banner = `<div class="banner red">${ic('desktop')}<div class="grow">${t('bannerHosted', devNameById(S.hostedById, 'desk'))}</div>
      <button class="danger" onclick="stopHosting()">${t('disconnect')}</button></div>`;
  } else if (S.incoming) {
    banner = `<div class="banner amber">${ic('shield')}<div class="grow">${t('bannerIncoming', devNameById(S.incoming.whoId, 'desk'))}</div></div>`;

    banner = `<div class="banner blue"><span class="spin big"></span><div class="grow">${t(ui.busy === 'install' ? 'busyInstall' : 'busyUninstall')}</div></div>`;
  }
  const isCopied = Date.now() - copied < 2000;
  const codes = S.codes.filter(c => !c.hidden);
  return `
    <div class="head"><h1>${t('devicesTitle')}</h1><span class="grow"></span>
      <span class="tip-wrap">
        <button class="${isCopied ? 'copied' : ''} ${activePulse === 'copy-btn' ? 'pulse' : ''}" onclick="copyCode()">${isCopied ? ic('check') + t('copiedValid') : ic('copy') + t('copyCodeBtn')}</button>
        <span class="tip-box">${t('copyCodeTip')}</span>
      </span>
    </div>
    <div class="connect ${activePulse === 'connect-box' ? 'pulse' : ''}" onclick="document.getElementById('connect-code-in')?.focus()">
      ${ic('link')}
      <input id="connect-code-in" name="connect-code" placeholder="${esc(t('connectPlaceholder'))}"
        onfocus="markStep('input')"
        oninput="onConnectInput(this)"
        onkeydown="if(event.key==='Enter')pasteCode(this.value)">
      <span id="connect-action-slot" data-mode="empty" onclick="event.stopPropagation()"></span>
    </div>
    ${codes.length ? `<div class="codes">${t('unusedCodesLabel')}${codes.map(c => `<span class="chip">${esc(t('codeCopiedAt', c.time))}<button class="ghost" onclick="revoke(${c.n})">${t('revoke')}</button></span>`).join('')}</div>` : ''}
    <div class="gap18"></div>
    ${banner}${list}`;
}

const sw = (key, dis) => `<span class="sw ${!dis && S.set[key] ? 'on' : ''} ${dis ? 'off-dis' : ''}" onclick="toggle('${key}', this)"></span>`;
const item = (icon, title, d, right, cls = '') =>
  `<div class="item ${cls}">${ic(icon)}<div class="txt2"><div class="t">${title}</div>${d ? `<div class="d">${d}</div>` : ''}</div><div class="r">${right}</div></div>`;

function setSkills(next) {
  S.set.skills = next;
  render();
  toast(t(next === 'installed' ? 'toastSkillsInstalled' : 'toastSkillsUninstalled'), next === 'installed' ? 'ok' : 'info');
}

function settingsHtml() {
  const st = S.set, busy = !!ui.busy;
  const saved = Date.now() - ui.saved < 1800 ? `<span class="saved">${t('savedBadge')}</span>` : '';
  const curSelfName = selfName();
  let h = `<div class="head"><h1>${t('settingsTitle')}</h1></div>`;
  h += `<div class="sec" id="sec-self"><div class="sh"><b>${t('secSelf')}</b></div><div class="group">
    ${item('rename', t('deviceName'), t('deviceNameDesc'), `${saved}<input id="device-name-in" name="device-name" class="field" style="width:200px" placeholder="${esc(t('defaultHostPrefix') + DEFAULT_HOST)}" value="${esc(curSelfName)}" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value=selfName();this.blur()}" onblur="saveName(this.value)">`)}
  </div></div>`;
  h += `<div class="sec"><div class="sh"><b>${t('secNet')}</b></div><div class="group">
    ${item('globe', t('publicRelay'), t('publicRelayDesc'), sw('public'))}
    ${item('wifi', t('lanDiscovery'), t('lanDiscoveryDesc'), sw('lan'))}
  </div></div>`;

  const relays = S.relays.filter(r => !r.hidden);
  const relayDesc = r => {
    const rtt = ui.probing ? t('probingDot') : (r.rtt ? ` · ${r.rtt} ms` : '');
    if (r.state === 'home') return [`${t('relayPrimary')}${rtt}`, ''];
    if (r.state === 'temp') return [`${t('relayTemp')}${rtt}`, ''];
    if (r.state === 'fail') return [t('relayFail'), 'amber'];
    return [`${t('relayIdle')}${rtt}`, 'grey'];
  };
  const probeBtn = relays.length
    ? `<button class="icon sh-act ${ui.probing ? 'spinning' : ''}" title="${esc(t(ui.probing ? 'probingTitle' : 'reprobeTitle'))}" ${ui.probing ? 'disabled' : ''} onclick="refreshRelays()">${ic('refresh')}</button>`
    : '';
  h += `<div class="sec" id="sec-relays"><div class="sh"><b>${t('secRelays')}</b><span>${t('secRelaysNote')}</span>${probeBtn}</div><div class="group">
    ${relays.map((r, i) => {
      const [desc, dotCls] = relayDesc(r);
      return `<div class="item"><span class="pdot ${dotCls}" style="margin:0 6px"></span>
      <div class="txt2"><div class="t mono" style="font-size:13px">${esc(r.host)}</div><div class="d">${desc}</div></div>
      <div class="r">${i ? `<button class="ghost" onclick="useRelay(${S.relays.indexOf(r)})">${t('setPrimary')}</button>` : ''}
      <button class="icon red" title="${esc(t('remove'))}" onclick="removeRelay(${S.relays.indexOf(r)})">${ic('del')}</button></div></div>`;
    }).join('')}
    ${ui.adding
      ? `<div class="item add-form" style="align-items:flex-start;padding-top:12px;padding-bottom:12px">${ic('server')}
           <div class="txt2" style="display:flex;flex-direction:column;gap:5px">
             <input class="field relay-in" style="width:100%" placeholder="${esc(t('relayPlaceholder'))}" ${ui.adding === 'busy' ? 'disabled' : ''}
               onkeydown="if(event.key==='Enter')addRelay();if(event.key==='Escape'){ui.adding=false;render()}">
             <div class="d">${t('relayHint')}</div>
           </div>
           <div class="r">
             <button class="ghost" onclick="ui.adding=false;render()">${t('cancel')}</button>
             ${ui.adding === 'busy' ? `<button disabled><span class="spin"></span>${t('addingBusy')}</button>` : `<button class="primary" onclick="addRelay()">${t('add')}</button>`}
           </div>
         </div>`
      : `<div class="item add" onclick="ui.adding=true;render();document.querySelector('#win .relay-in')?.focus()">${ic('add')}<div class="txt2">${t('addRelayBtn')}</div></div>`}
  </div></div>`;

  const on = st.svc === 'run';
  const svcRight = busy ? `<button disabled><span class="spin"></span>${t(ui.busy === 'install' ? 'busyInstallShort' : 'busyUninstallShort')}</button>`
    : on ? `<button onclick="service(false)">${ic('shield')}${t('uninstall')}</button>` : `<button class="primary" onclick="service(true)">${ic('shield')}${t('install')}</button>`;
  h += `<div class="sec"><div class="sh"><b>${t('secService')}</b></div><div class="group">
    ${item('service', t(on ? 'svcRunning' : 'svcNotInstalled'), t(on ? 'svcRunningDesc' : 'svcNotInstalledDesc'), svcRight)}
    ${item('power', t('startAtBoot'), t(on ? 'startAtBootDesc' : 'svcRequired'), sw('boot', !on), on ? '' : 'dis')}
    ${item('lock', t('allowLock'), t(on ? 'allowLockDesc' : 'svcRequired'), sw('lock', !on), on ? '' : 'dis')}
    ${item('bolt', t('keepAwake'), t(on ? 'keepAwakeDesc' : 'svcRequired'), sw('awake', !on), on ? '' : 'dis')}
  </div></div>`;

  const sk = st.skills || 'none';
  const skDesc = sk === 'installed' ? t('skillsInstalledDesc')
    : sk === 'outdated' ? t('skillsOutdatedDesc')
    : t('skillsNoneDesc');
  const skRight = sk === 'installed'
    ? `<button onclick="setSkills('none')">${t('uninstall')}</button>`
    : sk === 'outdated'
    ? `<button class="primary" onclick="setSkills('installed')">${t('update')}</button><button onclick="setSkills('none')">${t('uninstall')}</button>`
    : `<button onclick="setSkills('installed')">${t('install')}</button>`;
  h += `<div class="sec"><div class="sh"><b>${t('secAI')}</b></div><div class="group">
    ${item('bot', t('aiSkills'), skDesc, skRight)}
  </div></div>`;
  return h;
}

function modalView(m) {
  if (!m) return null;
  if (m.kind === 'delete') {
    const d = dev(m.devId);
    const nm = d ? devName(d) : '';
    return {
      icon: m.icon, tone: m.tone,
      title: t('delTitle', nm),
      text: t('delText'),
      btns: [
        [t('cancel'), '', m.actions[0]],
        [t('del'), 'danger', m.actions[1]],
      ],
    };
  }
  if (m.kind === 'wait') {
    const d = dev(m.devId);
    const nm = d ? devName(d) : '';
    const ki = d ? getKindInfo(d.kind).title : '';
    const via = d ? devVia(d) : '';
    const left = d?.waitLeft ?? 30;
    return {
      icon: m.icon, tone: m.tone, bar: m.bar,
      title: t('waitTitle', selfName(), nm),
      text: t('waitText', ki, via),
      foot: t('countdown', left),
      btns: [
        [t('simDecline'), 'danger-solid', m.actions[0]],
        [t('simAllow'), 'primary', m.actions[1]],
      ],
    };
  }
  if (m.kind === 'incoming') {
    const nm = devNameById(m.whoId, 'desk');
    const left = S.incoming?.left ?? 30;
    return {
      icon: m.icon, tone: m.tone, bar: m.bar,
      title: t('incomingTitle', nm),
      text: t('incomingText'),
      foot: t('countdown', left),
      btns: [
        [t('decline'), 'danger-solid', m.actions[0]],
        [t('allow'), 'primary', m.actions[1]],
      ],
    };
  }
  return null;
}

function render() {
  mountShell();
  renderGuide();
  const w = document.getElementById('win');
  const pane = w.querySelector('.pane');
  const sc = w.querySelector('.scroll');
  const prevPage = w.dataset.page;
  const pageChanged = Boolean(prevPage && prevPage !== S.page);
  const top = sc.scrollTop;
  const val = sc.querySelector('.connect input')?.value || '';
  const relayIn = sc.querySelector('.relay-in')?.value || '';

  const nav = (page, icon, label, extra = '') => {
    const pCls = (activePulse === 'nav-settings' && page === 'settings' && S.page !== 'settings') ? 'pulse' : '';
    const onCls = S.page === page ? (pageChanged ? 'on anim' : 'on') : '';
    return `<div class="nav ${onCls} ${pCls}" onclick="S.page='${page}';menu=null;if('${page}'==='settings')markStep('settings');render()">${ic(icon)}<span>${label}</span>${extra}</div>`;
  };

  const visibleRelays = S.relays.filter(r => !r.hidden);
  const relayBlock = visibleRelays.length
    ? `<div class="relays ${activePulse === 'relay-box' ? 'pulse' : ''}" title="${esc(t('relaysSidebarTitle'))}" onclick="jumpToSettings('sec-relays')">
        <div class="h"><span>${t('secRelays')}</span><span class="go">${t('manage')}</span></div>
        ${visibleRelays.map(r =>
          `<div class="r"><span class="pdot ${r.state === 'home' || r.state === 'temp' ? '' : r.state === 'fail' ? 'amber' : 'grey'}"></span><span>${esc(shortHost(r.host))}</span><span>${t(`rlabel_${r.state}`) || '…'}</span></div>`).join('')}
      </div>`
    : '';

  pane.innerHTML = `
    <div class="me" title="${esc(t('meSidebarTitle'))}" onclick="jumpToSettings('sec-self')">
      <div class="av mine" style="width:40px;height:40px;border-radius:10px">${ic(S.icon)}</div>
      <div><div class="nm">${esc(selfName())}</div><div class="st"><span class="pdot live"></span>${t('meStatus')}</div></div>
    </div>
    ${nav('devices', 'devices', t('navDevices'), `<span class="count">${S.devs.length}</span>`)}
    ${nav('settings', 'gear', t('navSettings'))}
    ${relayBlock}`;

  sc.innerHTML = S.page === 'devices' ? devicesHtml() : settingsHtml();
  if (pageChanged) {
    sc.scrollTop = 0;
    sc.classList.remove('page-enter');
    void sc.offsetWidth;
    sc.classList.add('page-enter');
  } else {
    sc.scrollTop = top;
  }

  renderMenu();

  const mv = modalView(modal);
  const modalLayer = w.querySelector('.modal-layer');
  modalLayer.innerHTML = mv ? `<div class="veil"><div class="dialog"><div class="top2"><div class="badge ${mv.tone}">${ic(mv.icon)}</div>
    <div><h4>${esc(mv.title)}</h4><p>${esc(mv.text)}</p></div></div>${mv.bar ? '<div class="bar"><div></div></div>' : ''}
    <div class="btns">${mv.foot ? `<span class="foot-note" id="modal-countdown">${esc(mv.foot)}</span>` : ''}${mv.btns.map((b, i) => `<button class="${b[1]}" onclick="modalBtn(${i})">${b[0]}</button>`).join('')}</div></div></div>` : '';

  const closedLayer = w.querySelector('.closed-layer');
  closedLayer.innerHTML = S.closed ? `<div class="closed">${t('closedMsg')}<button onclick="S.closed=false;render()">${t('openFromTray')}</button></div>` : '';

  w.dataset.page = S.page;
  const c = sc.querySelector('.connect input');
  if (c) {
    c.value = val;
    syncConnectAction();
  }
  const r = sc.querySelector('.relay-in'); if (r) r.value = relayIn;
  requestAnimationFrame(() => updateScrollbar?.(pageChanged));
}

function shortHost(h) {
  h = h.replace(/:\d+$/, '');
  return /[a-z]/i.test(h) && !h.includes(':') ? h.split('.')[0] : h;
}
function modalBtn(i) {
  const mv = modalView(modal);
  const f = mv?.btns[i]?.[2];
  modal = null;
  render();
  if (f) f();
}

  const nm = devNameById(remote.id);
  if (remote.toastKey === 'autoAccept') return t('noteAutoAccept');
  if (remote.toastKey === 'allowed') return t('noteAllowed', nm);
  if (remote.toastKey === 'mon') return t('rdMonitorToast', remote.mon);
  if (remote.toastKey === 'cad') return t('rdCadToast', nm);
  if (remote.toastKey === 'shortcut') return t('rdShortcutToast');
  return '';
}

          ${ic('term')}<span>${esc(t('termHeader', tName))}</span>
          <div class="grow"></div>
          <div class="caps"><span>${ic('min')}</span><span>${ic('max')}</span><span class="x" onclick="term=null;renderOverlay()">${ic('close')}</span></div>
        </div>
        <div class="term-body">${esc(lines.join('\n'))}</div>
        <div class="term-in">
          <span>PS ${esc(term.cwd)}&gt;</span>
          <input id="term-cmd" name="term-cmd" autocomplete="off" onkeydown="if(event.key==='Enter'){runTermCmd(this.value);this.value=''}">
        </div>
      </div>
    </div>`;
    return;
  }
  box.innerHTML = '';
}

document.addEventListener('paste', e => {
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || modal || remote || term) return;
  const t = e.clipboardData?.getData('text') || '';
  if (t.trim()) pasteCode(t);
});

reset();
</script>
</body>
</html>
